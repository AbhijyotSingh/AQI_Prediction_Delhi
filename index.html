<!DOCTYPE html>
<html>
    <head>
        <title>
            AQI Predictor
        </title>
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <h1>AQI Predictor</h1>
        <h2>Predicting AQI through years of data</h2>
        <form id="aqiForm">
            <label for="month">Enter month:</label>
            <input type="number" id="month" placeholder="1-12" min="1" max="12">
            <br>
            <label for="year">Enter year:</label>
            <input type="number" id="year" min="2000" max="2100" placeholder="2000-2100">
            <br>
            <label for="pm2_5">Enter particulate matter less than 2.5 micrometers (PM<sub>2.5</sub>) µg/m³:</label>
            <input type="number" id="pm2_5" step="any" min="0">
            <br>
            <label for="pm10">Enter particulate matter less than 10 micrometers (PM<sub>10</sub>) µg/m³:</label>
            <input type="number" id="pm10" step="any" min="0">
            <br>
            <label for="no2">Enter the quantity of Nitrogen Dioxide (NO<sub>2</sub>) µg/m³:</label>
            <input type="number" id="no2" step="any" min="0">
            <br>
            <label for="so2">Enter the quantity of Sulphur Dioxide (SO<sub>2</sub>) µg/m³:</label>
            <input type="number" id="so2" step="any" min="0">
            <br>
            <label for="co">Enter the quantity of Carbon Monoxide (CO) mg/m³:</label>
            <input type="number" id="co" step="any" min="0">
            <br>
            <label for="ozone">Enter the quantity of grounded Ozone (O<sub>3</sub>) µg/m³:</label>
            <input type="number" id="ozone" step="any" min="0">
            <br>
            <button type="submit">Predict AQI</button>
        </form>
        <div id="result"></div>
    <script>
        function calculateSubIndex(conc, breakpoints) {
    for (let [cLo, cHi, iLo, iHi] of breakpoints) {
        if (conc >= cLo && conc <= cHi) {
            return ((iHi - iLo) / (cHi - cLo)) * (conc - cLo) + iLo;
        }
    }
    return null; // out of defined range
}

function calculateActualAQI(pm2_5, pm10, no2, so2, co, ozone) {
    const breakpoints = {
        pm2_5: [[0,30,0,50],[31,60,51,100],[61,90,101,200],[91,120,201,300],[121,250,301,400],[251,380,401,500]],
        pm10:  [[0,50,0,50],[51,100,51,100],[101,250,101,200],[251,350,201,300],[351,430,301,400],[431,510,401,500]],
        no2:   [[0,40,0,50],[41,80,51,100],[81,180,101,200],[181,280,201,300],[281,400,301,400],[401,500,401,500]],
        so2:   [[0,40,0,50],[41,80,51,100],[81,380,101,200],[381,800,201,300],[801,1600,301,400],[1601,2100,401,500]],
        co:    [[0,1,0,50],[1.1,2,51,100],[2.1,10,101,200],[10.1,17,201,300],[17.1,34,301,400],[34.1,50,401,500]],
        ozone: [[0,50,0,50],[51,100,51,100],[101,168,101,200],[169,208,201,300],[209,748,301,400],[749,1000,401,500]]
    };

    const subIndices = [
        calculateSubIndex(pm2_5, breakpoints.pm2_5),
        calculateSubIndex(pm10, breakpoints.pm10),
        calculateSubIndex(no2, breakpoints.no2),
        calculateSubIndex(so2, breakpoints.so2),
        calculateSubIndex(co, breakpoints.co),
        calculateSubIndex(ozone, breakpoints.ozone)
    ].filter(v => v !== null);

    return Math.max(...subIndices);
}
        const BACKEND_URL = "https://aqi-prediction-delhi.onrender.com";

    // Wake up the backend as soon as the page loads and shows a notification
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.requestPermission();
}

window.addEventListener("load", () => {
    fetch(BACKEND_URL)
        .then(() => {
            console.log("Backend warmed up");
            if (Notification.permission === "granted") {
                new Notification("AQI Predictor is ready!", {
                    body: "The backend has finished waking up — you can predict now."
                });
            }
        })
        .catch(error => console.log("Backend warm-up:", error));
});

    document.getElementById("aqiForm").addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("result").innerText = "Predicting... this may take up to a minute if the server was idle.";
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const pm2_5 = document.getElementById("pm2_5").value;
        const pm10 = document.getElementById("pm10").value;
        const no2 = document.getElementById("no2").value;
        const so2 = document.getElementById("so2").value;
        const co = document.getElementById("co").value;
        const ozone = document.getElementById("ozone").value;

        fetch(BACKEND_URL + "/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                month: month,
                year: year,
                pm2_5: pm2_5,
                pm10: pm10,
                no2: no2,
                so2: so2,
                co: co,
                ozone: ozone
            })
        })
        .then(response => response.json())
.then(data => {
    const predicted = data.Predicted_AQI;

    const actual = calculateActualAQI(
        parseFloat(pm2_5),
        parseFloat(pm10),
        parseFloat(no2),
        parseFloat(so2),
        parseFloat(co),
        parseFloat(ozone)
    );

    let errorText;

    if (actual === 0) {
        errorText = "N/A (calculated AQI is 0)";
    } else {
        const error = Math.abs(predicted - actual) / actual * 100;
        errorText = error.toFixed(2) + "%";
    }

    document.getElementById("result").innerHTML =
        "Predicted AQI: " + predicted.toFixed(2) + "<br>" +
        "Calculated AQI: " + actual.toFixed(2) + "<br>" +
        "Percentage Error: " + errorText;
})
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("result").innerText =
                "Something went wrong.";
        });
    });
    </script>
    </body>
</html>
