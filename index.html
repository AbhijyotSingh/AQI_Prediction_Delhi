<!DOCTYPE html>
<html>
    <head>
        <title>
            AQI Predictor
        </title>
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <h1>AQI Predictor</h1>
        <h2>Predicting AQI through years of data</h2>
        <form id="aqiForm">
            <label for="month">Enter month:</label>
            <input type="number" id="month" placeholder="1-12">
            <br>
            <label for="year">Enter year:</label>
            <input type="number" id="year">
            <br>
            <label for="pm2_5">Enter particulate matter less than 2.5 micrometers (PM<sub>2.5</sub>):</label>
            <input type="number" id="pm2_5" step="any">
            <br>
            <label for="pm10">Enter particulate matter less than 10 micrometers (PM<sub>10</sub>):</label>
            <input type="number" id="pm10" step="any">
            <br>
            <label for="no2">Enter the quantity of Nitrogen Dioxide (NO<sub>2</sub>):</label>
            <input type="number" id="no2" step="any">
            <br>
            <label for="so2">Enter the quantity of Sulphur Dioxide (SO<sub>2</sub>):</label>
            <input type="number" id="so2" step="any">
            <br>
            <label for="co">Enter the quantity of Carbon Monoxide (CO):</label>
            <input type="number" id="co" step="any">
            <br>
            <label for="ozone">Enter the quantity of grounded Ozone (O<sub>3</sub>):</label>
            <input type="number" id="ozone" step="any">
            <br>
            <button type="submit">Predict AQI</button>
        </form>
        <div id="result"></div>
    <script>
        const BACKEND_URL = "https://aqi-prediction-delhi.onrender.com";

    // Wake up the backend as soon as the page loads and shows a notification
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.requestPermission();
}

window.addEventListener("load", () => {
    fetch(BACKEND_URL)
        .then(() => {
            console.log("Backend warmed up");
            if (Notification.permission === "granted") {
                new Notification("AQI Predictor is ready!", {
                    body: "The backend has finished waking up — you can predict now."
                });
            }
        })
        .catch(error => console.log("Backend warm-up:", error));
});

    document.getElementById("aqiForm").addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("result").innerText = "Predicting... this may take up to a minute if the server was idle.";
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const pm2_5 = document.getElementById("pm2_5").value;
        const pm10 = document.getElementById("pm10").value;
        const no2 = document.getElementById("no2").value;
        const so2 = document.getElementById("so2").value;
        const co = document.getElementById("co").value;
        const ozone = document.getElementById("ozone").value;

        fetch(BACKEND_URL + "/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                month: month,
                year: year,
                pm2_5: pm2_5,
                pm10: pm10,
                no2: no2,
                so2: so2,
                co: co,
                ozone: ozone
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("result").innerText =
                "Predicted AQI: " + data.Predicted_AQI;
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("result").innerText =
                "Something went wrong.";
        });
    });
    </script>
    </body>
</html>
